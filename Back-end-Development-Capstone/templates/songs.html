{% extends 'base.html' %}{% block title %}Songs{% endblock %}{% block content %}<h1>Songs</h1><div class="grid">{% for s in songs %}<article class="card song" data-song-title="{{s.title}}"><h2>{{s.title}}</h2><p>{{s.artist}}</p><button onclick="document.getElementById('modal-{{forloop.counter}}').showModal()">Lyrics</button><dialog id="modal-{{forloop.counter}}"><h2>{{s.title}}</h2><p>{{s.lyrics}}</p><button onclick="this.closest('dialog').close()">Close</button></dialog></article>{% empty %}<p>Songs service unavailable.</p>{% endfor %}</div>{% endblock %}
