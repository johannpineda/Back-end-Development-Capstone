{% extends 'base.html' %}{% block title %}Concerts{% endblock %}{% block content %}<h1>Concerts</h1><div class="grid">{% for c in concerts %}<article class="card"><h2>{{c.name}}</h2><p>{{c.date}}</p><p>{{c.venue}} · {{c.city}} {{c.country}}</p><p>{{c.description}}</p></article>{% empty %}<article class="card"><h2>World Tour</h2><p>New dates coming soon.</p></article>{% endfor %}</div>{% endblock %}
